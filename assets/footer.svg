<text x="500" y="138" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-style="italic" fill="#E6F1FF">Thanks for visiting my profile!</text>
<text x="500" y="160" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#22D3EE" letter-spacing="1">Always Learning  •  Always Building  •  Always Growing</text>
</svg>