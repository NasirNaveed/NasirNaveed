<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Thanks for visiting my profile!">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1230"/><stop offset="1" stop-color="#060914"/></linearGradient>
<linearGradient id="wg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<filter id="glow" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="170" fill="url(#bg)"/>
<path d="M0 105 Q125 75 250 105 T500 105 T750 105 T1000 105 T1250 105 T1500 105 T1750 105 T2000 105" fill="none" stroke="url(#wg)" stroke-width="2" opacity="0.4"><animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="13s" repeatCount="indefinite"/></path>
